services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux.amd64
    container_name: collections-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata: